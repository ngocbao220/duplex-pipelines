[project]
name = "vilier-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy", "scipy", "pandas", "soundfile", "tqdm", "matplotlib",
  "torch", "torchaudio", "torchcodec", "librosa", "silero-vad",
  "pyannote.audio>=4.0", "huggingface-hub", "speechbrain", "nemo_toolkit[asr]", "numba<0.66",
  "setuptools<81", "wrapt>=2.4.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
