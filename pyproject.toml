[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duplex-pipelines"
version = "0.1.0"
description = "Three isolated two-speaker separation pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tqdm",
    "pyannote.audio",
    "torch",
    "torchaudio",
    "torchcodec",
    "soundfile",
    "diffusers",
    "huggingface-hub",
    "wrapt>=2.4.0",
    "onnxruntime",
    "speechbrain>=1.0,<2.0",
    "librosa>=0.10",
]

[project.optional-dependencies]
dev = ["pytest"]
cholimex = ["speechbrain>=1.0,<2.0"]
duplexchat = ["speechbrain>=1.0,<2.0"]
diarization-pyannote = ["pyannote.audio>=3.1"]
diarization-sortformer = [
    "Cython",
    "packaging",
    "nemo_toolkit[asr]",
]
separation-dialoguesidon = ["diffusers", "huggingface_hub"]
separation-sepformer = ["speechbrain>=1.0,<2.0"]

# torch / torchaudio / torchcodec resolve from PyPI by default so `uv sync`
# works on any machine. To pin a specific CUDA build, add a PyTorch wheel index
# and route the three packages to it (see README "Selecting a CUDA build"), e.g.:
#
#   [[tool.uv.index]]
#   name = "pytorch-cu130"
#   url = "https://download.pytorch.org/whl/cu130"
#   explicit = true
#
#   [tool.uv.sources]
#   torch = [{ index = "pytorch-cu130" }]
#   torchaudio = [{ index = "pytorch-cu130" }]
#   torchcodec = [{ index = "pytorch-cu130" }]

[tool.setuptools]
packages = ["core", "core.orchestration", "core.stereo_benchmark"]
